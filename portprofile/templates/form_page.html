<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0c10;
      --surface: #12161f;
      --surface-2: #181d29;
      --border: #242a38;
      --text: #e4e7ec;
      --muted: #8b93a1;
      --accent: #ff8a5b;
      --accent-2: #7ee2c6;
      --radius: 10px;
      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 40px 24px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,138,91,0.04), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(126,226,198,0.04), transparent 40%);
      pointer-events: none;
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }
    .back {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--accent-2); }
    h1 {
      font-family: var(--font-display);
      font-size: 1.7rem;
      margin-bottom: 6px;
    }
    .subtitle {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-2);
    }
    textarea { min-height: 90px; resize: vertical; }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }
    .btn {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 12px 24px;
      border-radius: 7px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    .btn-primary {
      background: var(--accent);
      color: #0a0c10;
      font-weight: 600;
    }
    .btn-primary:hover { background: #ffa27c; }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="{% url 'edit' %}" class="back">← back to edit</a>
    <h1>{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>

    <div class="card">
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <div style="color:#ff6b6b; font-size:0.8rem; margin-top:4px;">{{ field.errors }}</div>
            {% endif %}
          </div>
        {% endfor %}
        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'edit' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
